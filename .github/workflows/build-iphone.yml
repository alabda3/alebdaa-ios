name: Build Al-Ebdaa iPhone IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-iphone:
    runs-on: macos-15-intel
    timeout-minutes: 30

    steps:
      - name: Get project
        uses: actions/checkout@v4

      - name: Create visible iPhone window and diagnose black screen
        shell: bash
        run: |
          set -euo pipefail
          echo 'AL-EBDAA BLACK SCREEN DIAGNOSTIC BUILD V3'
          cat > 'src/الإبداع/SceneDelegate.swift' <<'SWIFT'
          import UIKit
          import WebKit

          @available(iOS 13.0, *)
          @objc(EbdaaSceneDelegate)
          final class SceneDelegate: UIResponder, UIWindowSceneDelegate {
              var window: UIWindow?

              func scene(_ scene: UIScene,
                         willConnectTo session: UISceneSession,
                         options connectionOptions: UIScene.ConnectionOptions) {
                  guard let windowScene = scene as? UIWindowScene else { return }
                  let newWindow = UIWindow(windowScene: windowScene)
                  newWindow.backgroundColor = .white
                  newWindow.rootViewController = EbdaaBrowserViewController()
                  window = newWindow
                  newWindow.makeKeyAndVisible()
                  NSLog("AlEbdaa: native window became visible (diagnostic V3)")
              }
          }

          @available(iOS 13.0, *)
          final class EbdaaBrowserViewController: UIViewController, WKNavigationDelegate, WKUIDelegate {
              private var browser: WKWebView!
              private let statusLabel = UILabel()
              private var isLoaded = false
              private var attempt = 0
              private let storeURL = URL(string: "https://alabda3.github.io/store/?source=pwa")!

              override func viewDidLoad() {
                  super.viewDidLoad()
                  view.backgroundColor = .white

                  let title = UILabel()
                  title.text = "الإبداع • نسخة الفحص 3"
                  title.font = .boldSystemFont(ofSize: 15)
                  title.textColor = .black

                  let reloadButton = UIButton(type: .system)
                  reloadButton.setTitle("تحديث", for: .normal)
                  reloadButton.addTarget(self, action: #selector(reloadStore), for: .touchUpInside)

                  let safariButton = UIButton(type: .system)
                  safariButton.setTitle("Safari", for: .normal)
                  safariButton.addTarget(self, action: #selector(openSafari), for: .touchUpInside)

                  let header = UIStackView(arrangedSubviews: [title, reloadButton, safariButton])
                  header.axis = .horizontal
                  header.alignment = .center
                  header.spacing = 12
                  header.isLayoutMarginsRelativeArrangement = true
                  header.layoutMargins = UIEdgeInsets(top: 0, left: 12, bottom: 0, right: 12)
                  header.translatesAutoresizingMaskIntoConstraints = false
                  header.backgroundColor = .white

                  statusLabel.text = "جاري فتح المتجر..."
                  statusLabel.font = .systemFont(ofSize: 12)
                  statusLabel.textColor = .darkGray
                  statusLabel.backgroundColor = UIColor(white: 0.94, alpha: 1)
                  statusLabel.textAlignment = .center
                  statusLabel.numberOfLines = 0
                  statusLabel.translatesAutoresizingMaskIntoConstraints = false

                  let configuration = WKWebViewConfiguration()
                  configuration.allowsInlineMediaPlayback = true
                  // Unlike the old wrapper, do not restrict WebKit to app-bound domains.
                  configuration.limitsNavigationsToAppBoundDomains = false

                  let webView = WKWebView(frame: .zero, configuration: configuration)
                  webView.translatesAutoresizingMaskIntoConstraints = false
                  webView.backgroundColor = .white
                  webView.scrollView.backgroundColor = .white
                  webView.isOpaque = false
                  webView.navigationDelegate = self
                  webView.uiDelegate = self
                  webView.allowsBackForwardNavigationGestures = true
                  browser = webView

                  view.addSubview(header)
                  view.addSubview(statusLabel)
                  view.addSubview(webView)
                  let safe = view.safeAreaLayoutGuide
                  NSLayoutConstraint.activate([
                      header.topAnchor.constraint(equalTo: safe.topAnchor),
                      header.leadingAnchor.constraint(equalTo: view.leadingAnchor),
                      header.trailingAnchor.constraint(equalTo: view.trailingAnchor),
                      header.heightAnchor.constraint(equalToConstant: 48),
                      statusLabel.topAnchor.constraint(equalTo: header.bottomAnchor),
                      statusLabel.leadingAnchor.constraint(equalTo: view.leadingAnchor),
                      statusLabel.trailingAnchor.constraint(equalTo: view.trailingAnchor),
                      statusLabel.heightAnchor.constraint(greaterThanOrEqualToConstant: 28),
                      webView.topAnchor.constraint(equalTo: statusLabel.bottomAnchor),
                      webView.leadingAnchor.constraint(equalTo: view.leadingAnchor),
                      webView.trailingAnchor.constraint(equalTo: view.trailingAnchor),
                      webView.bottomAnchor.constraint(equalTo: view.bottomAnchor)
                  ])
                  loadStore()
              }

              private func loadStore() {
                  attempt += 1
                  let currentAttempt = attempt
                  isLoaded = false
                  statusLabel.text = "جاري تحميل متجر الإبداع..."
                  browser.load(URLRequest(url: storeURL,
                                          cachePolicy: .reloadIgnoringLocalCacheData,
                                          timeoutInterval: 25))
                  DispatchQueue.main.asyncAfter(deadline: .now() + 20) { [weak self] in
                      guard let self = self, self.attempt == currentAttempt, !self.isLoaded else { return }
                      self.statusLabel.text = "التحميل متأخر. اضغط تحديث أو Safari."
                  }
              }

              @objc private func reloadStore() { loadStore() }
              @objc private func openSafari() { UIApplication.shared.open(storeURL) }

              func webView(_ webView: WKWebView, didStartProvisionalNavigation navigation: WKNavigation!) {
                  statusLabel.text = "جاري الاتصال بالمتجر..."
              }

              func webView(_ webView: WKWebView, didFinish navigation: WKNavigation!) {
                  isLoaded = true
                  statusLabel.text = "تم تحميل الصفحة داخل التطبيق ✓"
                  NSLog("AlEbdaa: web navigation finished: %@", webView.url?.absoluteString ?? "unknown")
              }

              private func showError(_ error: Error) {
                  isLoaded = false
                  statusLabel.text = "خطأ التحميل: \(error.localizedDescription)"
                  NSLog("AlEbdaa web error: %@", error.localizedDescription)
              }

              func webView(_ webView: WKWebView,
                           didFailProvisionalNavigation navigation: WKNavigation!,
                           withError error: Error) {
                  if (error as NSError).code != NSURLErrorCancelled { showError(error) }
              }

              func webView(_ webView: WKWebView,
                           didFail navigation: WKNavigation!,
                           withError error: Error) {
                  if (error as NSError).code != NSURLErrorCancelled { showError(error) }
              }

              func webViewWebContentProcessDidTerminate(_ webView: WKWebView) {
                  statusLabel.text = "أُعيد تشغيل صفحة المتجر بعد توقف WebKit."
                  loadStore()
              }

              func webView(_ webView: WKWebView,
                           createWebViewWith configuration: WKWebViewConfiguration,
                           for navigationAction: WKNavigationAction,
                           windowFeatures: WKWindowFeatures) -> WKWebView? {
                  if let url = navigationAction.request.url { UIApplication.shared.open(url) }
                  return nil
              }

              func webView(_ webView: WKWebView,
                           decidePolicyFor navigationAction: WKNavigationAction,
                           decisionHandler: @escaping (WKNavigationActionPolicy) -> Void) {
                  guard let url = navigationAction.request.url else {
                      decisionHandler(.allow)
                      return
                  }
                  if navigationAction.navigationType == .linkActivated,
                     url.scheme != "https" || url.host == nil {
                      decisionHandler(.cancel)
                      UIApplication.shared.open(url)
                      return
                  }
                  if navigationAction.navigationType == .linkActivated,
                     let host = url.host,
                     host != "alabda3.github.io" {
                      decisionHandler(.cancel)
                      UIApplication.shared.open(url)
                      return
                  }
                  decisionHandler(.allow)
              }
          }
          SWIFT
          PLIST='src/الإبداع/Info.plist'
          /usr/libexec/PlistBuddy -c 'Set :UIApplicationSceneManifest:UISceneConfigurations:UIWindowSceneSessionRoleApplication:0:UISceneDelegateClassName EbdaaSceneDelegate' "$PLIST"
          /usr/libexec/PlistBuddy -c 'Delete :UIMainStoryboardFile' "$PLIST" || true
          /usr/libexec/PlistBuddy -c 'Delete :UIApplicationSceneManifest:UISceneConfigurations:UIWindowSceneSessionRoleApplication:0:UISceneStoryboardFile' "$PLIST" || true
          /usr/libexec/PlistBuddy -c 'Delete :WKAppBoundDomains' "$PLIST" || true
          plutil -lint "$PLIST"
          echo 'Diagnostic startup window installed.'

      - name: Build iPhone app
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project 'src/الإبداع.xcodeproj' \
            -scheme 'الإبداع' \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CURRENT_PROJECT_VERSION=3 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Create and validate diagnostic IPA
        shell: bash
        run: |
          set -euo pipefail
          APP_SRC="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/الإبداع.app"
          test -d "$APP_SRC" || { echo 'Built .app not found'; exit 1; }
          mkdir -p Payload
          ditto "$APP_SRC" 'Payload/AlEbdaa.app'
          PLIST='Payload/AlEbdaa.app/Info.plist'
          test -f "$PLIST" || { echo 'Info.plist missing'; exit 1; }
          OLD_EXEC=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$PLIST")
          test -f "Payload/AlEbdaa.app/$OLD_EXEC" || { echo 'Main executable missing'; exit 1; }
          if [[ "$OLD_EXEC" != 'AlEbdaa' ]]; then
            mv "Payload/AlEbdaa.app/$OLD_EXEC" 'Payload/AlEbdaa.app/AlEbdaa'
          fi
          /usr/libexec/PlistBuddy -c 'Set :CFBundleExecutable AlEbdaa' "$PLIST"
          chmod 755 'Payload/AlEbdaa.app/AlEbdaa'
          file 'Payload/AlEbdaa.app/AlEbdaa'
          lipo -archs 'Payload/AlEbdaa.app/AlEbdaa' | grep -qw arm64
          /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$PLIST"
          zip -qry alebdaa-diagnostic-v3.ipa Payload
          unzip -tq alebdaa-diagnostic-v3.ipa
          unzip -Z -1 alebdaa-diagnostic-v3.ipa | grep -Fx 'Payload/AlEbdaa.app/AlEbdaa'
          echo 'Diagnostic IPA V3 validated'

      - name: Upload diagnostic IPA
        uses: actions/upload-artifact@v4
        with:
          name: alebdaa-diagnostic-v3
          path: alebdaa-diagnostic-v3.ipa
